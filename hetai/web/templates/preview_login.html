<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>预览登录 · {{ app_name }}</title>
  <link rel="stylesheet" href="/static/hetai.css">
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="brand">
        <a href="/preview/login" class="logo">{{ app_name }}</a>
        <p class="tag">公开预览 · 示例数据 · 未连接真实 Telegram Bot</p>
      </div>
    </header>
    <div class="banner demo" role="status">这是独立测试预览，只有示例数据，不会发送 Telegram 消息。</div>
    <main id="main">
      {% if flash_error %}<p class="flash err" role="alert">{{ flash_error }}</p>{% endif %}
      <h1>预览访问</h1>
      <p class="muted">请输入预览口令。登录后可切换示例身份查看同一界面。</p>
      <form method="post" action="/preview/login" autocomplete="on">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input type="hidden" name="next" value="{{ next_path }}">
        <p>
          <label for="username">用户名</label><br>
          <input id="username" name="username" value="preview" autocomplete="username">
        </p>
        <p>
          <label for="password">预览口令</label><br>
          <input id="password" name="password" type="password" required autocomplete="current-password">
        </p>
        <p><button type="submit">进入预览</button></p>
      </form>
    </main>
  </div>
</body>
</html>
