{% extends "base.html" %}
{% block content %}
<h1>群设置</h1>
{% if context.group %}
<form class="stack card" method="post" action="/admin/groups/{{ context.group.id }}/settings">
  <label>名称 <input name="title" value="{{ context.group.title }}" required maxlength="128"></label>
  <label>说明 <textarea name="description">{{ context.group.description }}</textarea></label>
  <label><input type="checkbox" name="is_active" value="1" {% if context.group.is_active %}checked{% endif %}> 启用该群</label>
  <label><input type="checkbox" name="points_enabled" value="1" {% if context.group.settings and context.group.settings.points_enabled %}checked{% endif %}> 启用积分</label>
  <label><input type="checkbox" name="directory_enabled" value="1" {% if context.group.settings and context.group.settings.directory_enabled %}checked{% endif %}> 启用目录投稿</label>
  <label>通过投稿奖励积分（默认 0）
    <input type="number" name="publish_reward_points_value" min="0" step="1" value="{{ context.group.settings.publish_reward_points if context.group.settings and context.group.settings.publish_reward_points else 0 }}">
  </label>
  <label>奖励规则说明
    <input name="publish_reward_label_value" maxlength="256" value="{{ context.group.settings.publish_reward_label if context.group.settings and context.group.settings.publish_reward_label else '' }}">
  </label>
  <div class="actions"><button type="submit">保存设置</button></div>
</form>
{% endif %}
{% endblock %}
