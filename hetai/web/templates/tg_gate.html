<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>请在 Telegram 中打开 · {{ app_name }}</title>
  <link rel="stylesheet" href="/static/hetai.css">
</head>
<body data-surface="/tg" data-tg-gate="1">
  <div class="shell">
    <div class="shell-body">
      <header class="top">
        <div class="brand">
          <a class="logo" href="/tg">{{ app_name }}</a>
          <p class="tag">专用测试 Bot 入口</p>
        </div>
      </header>
      <main id="main">
        <h1>{{ error_title or "请从 Telegram 打开" }}</h1>
        <p class="lead">这里是真实 Telegram 身份的测试入口，不会进入示例夹具，也不能用预览口令操作真实群。</p>
        <p class="muted">请在 Telegram 中打开{% if bot_username %} @{{ bot_username }}{% endif %}，使用 /start 或菜单按钮进入合台。此页不会假装已经完成客户端内验证，直到你实际打开并完成 initData 登录。</p>
        <p class="empty">若已在 Mini App 中打开，正在尝试建立会话…</p>
      </main>
    </div>
  </div>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/static/hetai.js" defer></script>
</body>
</html>
