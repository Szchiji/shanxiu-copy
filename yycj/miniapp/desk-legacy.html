<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>管理后台 v20</title>
  <script src="./telegram-web-app.js"></script>
  <script>
  if (!(window.Telegram && window.Telegram.WebApp)) {
    document.write('<script src="https://telegram.org/js/telegram-web-app.js"><\/script>');
  }
  </script>

  <link rel="stylesheet" href="./admin.css?v=20261111n" />
  <link rel="stylesheet" href="./admin-ux.css?v=20261030d" />
  <link rel="stylesheet" href="./admin-proposal.css?v=20261030d" />
  <link rel="stylesheet" href="./admin-city.css?v=20261110b" />
  <link rel="stylesheet" href="./admin-insights.css?v=20261031e" />
  <link rel="stylesheet" href="./hours.css?v=20261030d" />
  <style>.rev-sec{margin:6px 0}.rev-sec dt{font-size:12px;color:#C9A45C;margin-top:6px}.rev-sec dd{margin:2px 0 0}.rev-proof{margin-top:8px;padding:8px;border:1px dashed #C9A45C;border-radius:10px}</style>
  <link rel="stylesheet" href="./edit-state-ui.css?v=20261111f" />
  <link rel="stylesheet" href="./edit-history-ui.css?v=20261111n" />
  <link rel="stylesheet" href="./admin-messages.css?v=20261110h"/>
</head>
<body class="admin-body">
  <header class="topbar">
    <div class="row" style="gap:8px;align-items:center">
      <button class="btn" id="btnMenu" type="button" aria-label="菜单">☰</button>
      <div>
        <h1>月影管理 v20</h1>
        <div class="admin-crumb" id="adminCrumb">审核</div>
        <div id="status" class="muted"></div>
      </div>
    </div>
    <div class="row">
      <a class="btn" href="./index.html?v=20261030d">首页</a>
      <button class="btn" id="btnRefresh" type="button">刷新</button>
    </div>
  </header>
  <div id="gate" class="card">正在校验管理员身份…</div>
  <div class="side-mask" id="sideMask"></div>
  <aside class="admin-side" id="adminSide">
    <div class="side-label">内容</div>
    <button type="button" class="active" data-pane="audit">审核</button>
    <button type="button" data-pane="listings">上架资料</button>
    <button type="button" data-pane="pin">卡片置顶</button>
    <button type="button" data-pane="carousel">精选轮播</button>
    <div class="side-label">运营</div>
    <button type="button" data-pane="venue">站点设置</button>
    <button type="button" data-pane="users">用户</button>
    <button type="button" data-pane="more">风控</button>
  </aside>
  <div id="console" class="admin-shell hidden">
    <div class="admin-main">
      <section class="admin-pane active" id="pane-audit">
        <h3>待审核</h3>
        <div id="adminPosts"></div>
        <div id="adminReviews" style="margin-top:12px"></div>
      </section>
      <section class="admin-pane" id="pane-pin">
        <h3>卡片置顶</h3>
        <div id="adminFeedPins"></div>
        <div class="ops-card">
          <h4>添加置顶</h4>
          <div class="row">
            <input id="feedPinQ" placeholder="搜花名 / 城市 / ID" />
            <button class="btn" id="btnFeedPinSearch" type="button">搜索</button>
          </div>
          <div id="feedPinResults" class="pick-list"></div>
        </div>
      </section>
      <section class="admin-pane" id="pane-carousel">
        <h3>精选轮播</h3>
        <div id="adminPins"></div>
        <div class="ops-card">
          <h4>添加轮播</h4>
          <p class="muted" style="margin:0 0 8px">每条自己填有效小时，空着就是长期</p>
          <div class="row">
            <input id="pinQ" placeholder="搜花名 / 城市 / ID" />
            <button class="btn" id="btnPinSearch" type="button">搜索</button>
          </div>
          <div id="pinResults" class="pick-list"></div>
        </div>
      </section>
      <section class="admin-pane" id="pane-listings">
        <h3>上架资料</h3>
        <div class="row">
          <input id="listingQ" placeholder="搜花名 / 城市" />
          <button class="btn" id="btnListingSearch" type="button">筛选</button>
        </div>
        <div id="adminListings"></div>
      </section>
      <section class="admin-pane" id="pane-users">
        <h3>用户</h3>
        <div class="ops-card">
          <div class="row">
            <input id="userQ" placeholder="ID / @用户名 / 昵称" />
            <button class="btn" id="btnUserSearch" type="button">搜索</button>
          </div>
          <div id="adminUsers"></div>
        </div>
      </section>
      <section class="admin-pane" id="pane-venue">
        <h3>站点设置</h3>
        <div class="ops-card">
          <h4>首页</h4>
          <label>公告</label>
          <input id="annText" />
          <label class="row"><input type="checkbox" id="annOn" checked /> 显示公告</label>
          <label>开放城市（逗号分隔）</label>
          <input id="citiesInput" />
          <label>首页每次加载条数</label>
          <input id="opsPageSize" type="number" min="1" max="50" value="3" />
          <label>轮播间隔秒</label>
          <input id="opsCarouselSec" type="number" min="2" max="15" value="4" />
        </div>
        <div class="ops-card">
          <h4>入口与联系</h4>
          <label>聊天按钮文案</label>
          <input id="opsCta" value="想聊聊" maxlength="32" />
          <label>Bot /start 欢迎语</label>
          <textarea id="opsWelcome" rows="3"></textarea>
          <label>管理员联系链接</label>
          <input id="opsAdminContact" placeholder="https://t.me/用户名" />
          <label class="row"><input type="checkbox" id="opsShowBot" checked /> 首页显示机器人</label>
          <label class="row"><input type="checkbox" id="opsShowAdmin" checked /> 首页显示管理员</label>
          <label>必订频道/群</label>
          <textarea id="opsChats" rows="3"></textarea>
        </div>
        <div class="ops-card">
          <h4>媒体与推送</h4>
          <label>媒体存储频道 ID</label>
          <input id="opsMediaChannel" placeholder="-100xxxxxxxxxx" />
          <label>审核通过推送频道（@频道名 或 -100…）</label>
          <input id="opsChannel" placeholder="@yydanganguan" />
          <label>推送文案模板</label>
          <textarea id="opsBroadcastTpl" rows="6"></textarea>
        </div>
        <div class="ops-card">
          <h4>上架规则</h4>
          <label>上架媒体上限</label>
          <input id="opsMediaMax" type="number" min="1" max="9" value="6" />
          <label>上架有效天数</label>
          <input id="opsListingDays" type="number" min="1" max="365" value="30" />
          <label class="row"><input type="checkbox" id="opsReviewAudit" checked /> 评价需审核后展示</label>
        </div>
        <button class="btn primary block" id="btnOpsSave" type="button">保存全站设置</button>
        <button class="btn block" id="btnSyncBot" type="button">同步机器人用户名</button>
      </section>
      <section class="admin-pane" id="pane-more">
        <h3>风控</h3>
        <div class="ops-card">
          <h4>举报</h4>
          <div id="adminReports"></div>
        </div>
      </section>
    </div>
  </div>
  <script src="./admin-boot.js?v=20261030d"></script>
  <script src="./edit-state-ui.js?v=20261111f"></script>
  <script src="./edit-history-ui.js?v=20261111n"></script>
  <script src="./admin.js?v=20261112a"></script>
  <script src="./admin-ops.js?v=20261112a"></script>
  <script src="./admin-list.js?v=20261111d"></script>
  <script src="./hours-picker.js?v=20261030d"></script>
  <script src="./admin-proxy.js?v=20261111a"></script>
  <script src="./admin-picks.js?v=20261030d"></script>
  <script src="./admin-executions.js?v=20261110h"></script>
  <script src="./admin-side.js?v=20261030d"></script>
  <script src="./admin-ux.js?v=20261112a"></script>
  <script src="./admin-kit.js?v=20261111f"></script>
  <script src="./admin-proposal.js?v=20261112a"></script>
  <script src="./admin-buttons.js?v=20261111a"></script>
  <script src="./admin-city.js?v=20261110h"></script>
<script src="./admin-insights.js?v=20261031e"></script>
<script src="./admin-coupons.js?v=20261111a"></script>
</body>
</html>
